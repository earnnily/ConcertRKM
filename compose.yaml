services:
  booking:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      BIND_HOST: 0.0.0.0
    volumes:
      - booking-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOOKING_DOMAIN: ${BOOKING_DOMAIN:?Set BOOKING_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - booking
volumes:
  booking-data:
  caddy-data:
  caddy-config:
